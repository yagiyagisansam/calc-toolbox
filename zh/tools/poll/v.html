<body>
<!-- @langsw start -->
<div class="lang-bar">
  <nav class="lang-switch" aria-label="语言"><span class="lang-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 2.6 15 0 18M12 3c-2.6 2.6-2.6 15 0 18"/></svg>Language</span><a href="/tools/poll/v.html" lang="ja" hreflang="ja">日本語</a><a href="/en/tools/poll/v.html" lang="en" hreflang="en">English</a><span class="lang-current">简体中文</span><a href="/ko/tools/poll/v.html" lang="ko" hreflang="ko">한국어</a></nav>

<header class="pb-header">
  <a href="/zh/tools/poll/">
    <span class="pb-mark"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span>
    <span class="pb-name">大家的投票</span>
  </a>
  <a class="pb-cta" href="/zh/tools/poll/new.html">创建问卷</a>
</header>
<main>
  <div class="pb-card" id="main-card">
    <h1 class="pb-q" id="q-title">正在加载问卷…</h1>
    <p class="pb-deadline" id="deadline" hidden></p>
    <p class="pb-status" id="status" hidden></p>
    <form id="vote-form" hidden>
      <p class="pb-meta" id="vote-note">每人限投1次·点击选项即可投票</p>
      <div class="pb-opts" id="opts"></div>
      <button type="submit" class="pb-btn" id="vote-btn" disabled>按此选择投票</button>
      <p class="pb-center mt12"><a class="pb-sub-link" href="#" id="peek-link">不投票,只看结果</a></p>
    </form>
    <div id="result" hidden aria-live="polite"></div>
  </div>

  <div id="share-box" hidden>
    <div class="pb-sec"><b>把这份问卷传播出去</b></div>
    <div class="pb-share" id="share-row"></div>
    <button type="button" class="pb-btn-sub" id="qr-btn">＋ 显示二维码(用于打印·张贴)</button>
    <div class="pb-qr" id="qr-box" hidden></div>
  </div>

  <p class="pb-center mt20"><a class="pb-link" href="/zh/tools/poll/new.html">我也来创建问卷(免费·无需注册)</a></p>
  <button type="button" class="pb-report" id="owner-del-btn" hidden>删除这份问卷(仅限创建者)</button>
  <button type="button" class="pb-report" id="report-btn" hidden>举报有问题的问卷</button>

  <div class="pb-modal-bg" id="del-confirm-bg" hidden>
    <div class="pb-modal" role="dialog" aria-modal="true" aria-labelledby="del-confirm-title">
      <p class="pb-q pb-q-sm" id="del-confirm-title">要删除这份问卷吗?</p>
      <p class="pb-meta">已收集的票数也会一并消失。删除后无法恢复。</p>
      <p class="pb-error" id="del-error" hidden></p>
      <button type="button" class="pb-btn" id="del-yes">是,删除</button>
      <button type="button" class="pb-btn-sub" id="del-no">否,取消</button>
    </div>
  </div>

  <div class="pb-modal-bg" id="report-confirm-bg" hidden>
    <div class="pb-modal" role="dialog" aria-modal="true" aria-labelledby="report-confirm-title">
      <p class="pb-q pb-q-sm" id="report-confirm-title">要举报这份问卷吗?</p>
      <p class="pb-meta">当内容存在诽谤中伤、色情、广告宣传等问题时,请进行举报。举报无法撤销。</p>
      <button type="button" class="pb-btn" id="report-yes">是,举报</button>
      <button type="button" class="pb-btn-sub" id="report-no">否,取消</button>
    </div>
  </div>
</main>
<footer class="pb-footer">
